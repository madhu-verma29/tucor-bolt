services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tucor_dev
      POSTGRES_USER: uco_user
      POSTGRES_PASSWORD: uco_user_password
    ports: ["5433:5432"]
    volumes: ["tucor_pg:/var/lib/postgresql/data"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  tucor_pg:
