server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/tucor_dev}
    username: ${DATABASE_USERNAME:uco_user}
    password: ${DATABASE_PASSWORD:uco_user_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
tucor:
  jwt:
    secret: ${JWT_SECRET:change-this-local-development-secret-key-at-least-32-bytes}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:30}
  cors-origins: ${CORS_ORIGINS:http://localhost:4028}
  web-url: ${WEB_URL:http://localhost:4028}
  mail:
    from: ${MAIL_FROM:no-reply@tucor.local}
