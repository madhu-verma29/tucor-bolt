name: Production readiness
on:
  push:
    branches: [buyer-seller-production-hardening, admin-production-hardening, buyer-map-location-link]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run type-check
      - run: node --test scripts/auth-session.test.cjs
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.test
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tucor_test
          POSTGRES_USER: tucor_test
          POSTGRES_PASSWORD: ci-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U tucor_test -d tucor_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify -f backend/pom.xml
        env:
          TUCOR_INTEGRATION: 'true'
          DATABASE_URL: jdbc:postgresql://localhost:5432/tucor_test
          DATABASE_USERNAME: tucor_test
          DATABASE_PASSWORD: ci-only-password
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/target/surefire-reports
